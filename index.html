<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>三日分化 3D 动作要领</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --bg:#eceef0; --surface:#f7f8f9; --surface2:#dfe3e7; --ink:#191b1e; --ink2:#5d646b; --line:#d1d6db;
  --amber:#df9a0e; --amber-soft:rgba(223,154,14,.17); --amber-ink:#1a1b1d; --bad:#c6452f;
  --scene-bg:#e3e6e9; --scene-floor:#c9cfd5; --scene-spot:#f1f3f5; --scene-grid:#b4bcc4;
  --veil:rgba(247,248,249,.74);
  --display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121315; --surface:#1a1c1f; --surface2:#262a2e; --ink:#edebe6; --ink2:#9aa1a8; --line:#2c3035;
    --amber:#f2ab1c; --amber-soft:rgba(242,171,28,.16); --amber-ink:#1a1b1d; --bad:#e2634b;
    --scene-bg:#141619; --scene-floor:#1d2024; --scene-spot:#2b3036; --scene-grid:#2e3339;
    --veil:rgba(20,22,25,.72);
  }
}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1a1c1f; --surface2:#262a2e; --ink:#edebe6; --ink2:#9aa1a8; --line:#2c3035;
  --amber:#f2ab1c; --amber-soft:rgba(242,171,28,.16); --amber-ink:#1a1b1d; --bad:#e2634b;
  --scene-bg:#141619; --scene-floor:#1d2024; --scene-spot:#2b3036; --scene-grid:#2e3339;
  --veil:rgba(20,22,25,.72);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.app{max-width:1180px;margin:0 auto;padding:0 0 40px}
.top{padding:16px 16px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:34px;line-height:.95;letter-spacing:.01em;margin:0}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--ink2);letter-spacing:.02em;margin-top:6px}
.hint{font-size:12px;color:var(--ink2);text-align:right;line-height:1.4;max-width:46%}
@media (max-width:640px){.brand{font-size:28px}.hint{max-width:none;text-align:left;flex-basis:100%}}

.days{display:flex;gap:8px;padding:8px 16px 4px}
.day{flex:1 1 0;min-width:0;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 11px 8px;transition:border-color .15s,background .15s}
.day b{display:block;font-family:var(--display);font-weight:800;font-size:24px;line-height:1}
.day span{display:block;font-size:12px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day.active{border-color:var(--amber);background:var(--amber-soft)}
.day.active b{color:var(--amber)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background .15s,color .15s,border-color .15s}
.chip i{font-style:normal;font-family:var(--display);font-weight:800;font-size:15px;color:var(--amber);line-height:1}
.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.active i{color:var(--amber)}

.main{display:grid;grid-template-columns:1fr;gap:14px;padding:0 16px}
@media (min-width:900px){
  .main{grid-template-columns:minmax(0,1.3fr) minmax(330px,.9fr);align-items:start}
  .stage-col{position:sticky;top:12px}
}
.stage{position:relative;border-radius:20px;overflow:hidden;background:var(--scene-bg);aspect-ratio:1/1.06;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
@media (min-width:900px){.stage{aspect-ratio:4/3.4}}
.stage canvas{display:block;width:100%;height:100%}
.ov-title{position:absolute;left:14px;top:12px;pointer-events:none;max-width:62%}
.ov-title h2{margin:0;font-family:var(--display);font-weight:800;font-size:38px;line-height:.92;letter-spacing:.005em}
.ov-title .en{display:block;font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink2);letter-spacing:.03em;margin-top:5px}
.ov-phase{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.pill{background:var(--veil);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:500;line-height:1.3;white-space:nowrap}
.pill.phase{background:var(--amber);color:var(--amber-ink);font-weight:700;font-size:13px}
.ov-ctl{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:linear-gradient(to top,var(--scene-bg) 20%,transparent)}
.ctl{display:inline-flex;align-items:center;gap:6px;background:var(--veil);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:3px}
.ctl button{border-radius:999px;padding:6px 11px;font-size:12px;font-weight:500;line-height:1.2;color:var(--ink);transition:background .15s,color .15s}
.ctl button.on{background:var(--ink);color:var(--bg)}
.ctl button.icon{width:34px;height:30px;padding:0;display:grid;place-items:center}
.ctl button.icon svg{width:14px;height:14px;fill:currentColor}
.scrub{display:flex;align-items:center;gap:10px;padding:10px 4px 0}
.scrub input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:linear-gradient(to right,var(--amber) var(--pct,0%),var(--surface2) var(--pct,0%));outline-offset:4px}
.scrub input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--amber);border:3px solid var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.scrub input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--amber);border:3px solid var(--bg)}
.scrub .tm{font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink2);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.fallback[hidden]{display:none}
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--ink2);font-size:14px}

.info{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 18px 16px}
.info-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;border-bottom:1px solid var(--line)}
.info-head h3{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.info-head h3 span{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--ink2);margin-top:5px;letter-spacing:0}
.nav{display:flex;gap:6px}
.nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.nav button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sec{padding:14px 0 4px}
.sec h4{margin:0 0 8px;font-family:var(--display);font-weight:800;font-size:19px;line-height:1;letter-spacing:.01em}
.sec h4 em{font-style:normal;font-family:var(--body);font-weight:400;font-size:12px;color:var(--ink2);margin-left:8px}
.muscles{display:flex;flex-wrap:wrap;gap:6px}
.m{border-radius:999px;padding:4px 11px;font-size:12.5px;border:1px solid var(--line);color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.m::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--line)}
.m.p{background:var(--amber);color:var(--amber-ink);border-color:transparent;font-weight:700}
.m.p::before{background:var(--amber-ink)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:8px 10px 8px 42px;border-radius:12px;counter-increment:s;transition:background .25s}
.steps li::before{content:counter(s);position:absolute;left:10px;top:10px;width:23px;height:23px;border-radius:50%;background:var(--surface2);font-family:var(--display);font-weight:800;font-size:14px;text-align:center;line-height:23px;color:var(--ink2);transition:background .25s,color .25s}
.steps li.active{background:var(--amber-soft)}
.steps li.active::before{background:var(--amber);color:var(--amber-ink)}
.steps li.setup::before{background:transparent;border:1px dashed var(--line)}
.mist{list-style:none;margin:0;padding:0}
.mist li{position:relative;padding:5px 0 5px 24px;color:var(--ink)}
.mist li::before{content:"✕";position:absolute;left:2px;top:6px;font-size:11px;font-weight:700;color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink2);white-space:nowrap}
.kv dd{margin:0}
.foot{padding:14px 16px 0;font-size:12px;color:var(--ink2);line-height:1.6}
@media (prefers-reduced-motion: reduce){.steps li,.chip,.day{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1 class="brand">三日分化 3D 动作要领<small>推、拉、腿三天训练，每个动作的做法与常见错误</small></h1>
    <div class="hint">拖动旋转视角，双指或滚轮缩放。亮起的部位是本动作的目标肌群。</div>
  </header>

  <nav class="days" id="days" aria-label="训练日"></nav>
  <div class="chips" id="chips" aria-label="动作列表"></div>

  <div class="main">
    <div class="stage-col">
      <div class="stage" id="stage">
        <canvas id="c" aria-label="3D 动作演示"></canvas>
        <div class="fallback" id="fallback" hidden>3D 引擎未能加载。请检查网络后刷新页面。</div>
        <div class="ov-title"><h2 id="exName">上斜卧推<span class="en" id="exEn">Incline Bench Press</span></h2></div>
        <div class="ov-phase"><div class="pill phase" id="phase">下放</div><div class="pill" id="breath">吸气</div></div>
        <div class="ov-ctl">
          <div class="ctl">
            <button class="icon" id="play" aria-label="播放或暂停" title="播放 / 暂停"><svg viewBox="0 0 16 16" id="playIcon"><path d="M4 2.5v11l9-5.5z"/></svg></button>
          </div>
          <div class="ctl" id="speed" role="group" aria-label="速度">
            <button data-v="1" class="on">1×</button><button data-v="0.5">½×</button><button data-v="0.25">¼×</button>
          </div>
          <div class="ctl" id="views" role="group" aria-label="视角">
            <button data-v="preset" class="on">斜角</button><button data-v="front">正面</button><button data-v="side">侧面</button>
          </div>
          <div class="ctl">
            <button id="musclesBtn" class="on">肌肉高亮</button>
            <button id="pathBtn" class="on">轨迹</button>
            <button id="spinBtn">自动旋转</button>
          </div>
        </div>
      </div>
      <div class="scrub">
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="动作进度">
        <span class="tm" id="tm">0.0s</span>
      </div>
    </div>

    <aside class="info" id="info">
      <div class="info-head">
        <h3 id="iName">上斜卧推<span id="iMeta">Incline Bench Press</span></h3>
        <div class="nav">
          <button id="prev" aria-label="上一个动作"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
          <button id="next" aria-label="下一个动作"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
        </div>
      </div>
      <section class="sec"><h4>目标肌群<em>亮起的为主要，灰色为辅助</em></h4><div class="muscles" id="muscles"></div></section>
      <section class="sec"><h4>动作要领<em>随动画同步高亮</em></h4><ol class="steps" id="steps"></ol></section>
      <section class="sec"><h4>常见错误</h4><ul class="mist" id="mist"></ul></section>
      <section class="sec"><h4>呼吸与安排</h4><dl class="kv" id="kv"></dl></section>
    </aside>
  </div>
  <p class="foot">动画为示意性的标准动作范式。重量、幅度和站距请按自身体型与教练建议调整；有伤病史时先咨询专业人士。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('fallback').hidden=false;return;}
/* ======================= 数据：肌群、动作、训练日 ======================= */
const MUSCLE_NAMES = {
  chest:'胸大肌', frontDelt:'三角肌前束', sideDelt:'三角肌中束', rearDelt:'三角肌后束',
  triceps:'肱三头肌', biceps:'肱二头肌', forearm:'前臂', lats:'背阔肌', traps:'斜方肌',

  hands 手掌目标（相对坐标系由 handRel 决定）；elbowPole 肘尖指向；feet 脚掌着地点；kneePole 膝盖指向
  twist 手掌绕前臂旋转角；footPitch 脚尖下压角；toeOut 脚尖外展角
  数组 [x,y,z] 表示左右对称（左侧 x 取负），{L:[],R:[]} 分别指定
*/

      {t:0.55, phase:'向上推起', breath:'呼气', cue:4, hands:[0.3,0.15,0.12]},
      {t:0.92, phase:'顶部锁定', breath:'换气', cue:4, hands:[0.15,0.58,0.09]}
    ],
    cues:[
      '靠背调到 30° 左右，过陡会变成肩推。肩胛后缩并下沉，上背和臀部全程贴紧凳面，双脚踩实地面',
      '握距比肩略宽，手腕保持中立不要后折，起始时杠铃位于锁骨正上方',

    breath:'下放吸气，推起呼气', plan:'3 到 4 组，每组 8 到 12 次', tempo:'下放 2 到 3 秒，停顿 1 秒，推起 1 秒'
  },

  bench: {
    name:'卧推', en:'Bench Press', gear:['bench','barbell'], dur:4.4,
    primary:['chest'], secondary:['frontDelt','triceps'],
    cam:{az:-62, el:14, dist:3.0, target:[0,0.72,-0.1]},

      {t:0,    phase:'控制下放', breath:'吸气', cue:2, hands:[0.15,0.58,0.1]},
      {t:0.45, phase:'底部轻触', breath:'屏息', cue:3, hands:[0.3,0.16,0.13]},
      {t:0.55, phase:'向上推起', breath:'呼气', cue:4, hands:[0.3,0.16,0.13]},
      {t:0.92, phase:'顶部锁定', breath:'换气', cue:4, hands:[0.15,0.58,0.1]}
    ],
    cues:[
      '仰卧，眼睛位于杠铃正下方。肩胛后缩下沉“夹住”凳子，自然挺胸，双脚踩实并持续向下蹬',

/* ---------- IK（双骨链解算） ---------- */
const _S = new THREE.Vector3(), _u = new THREE.Vector3(), _v = new THREE.Vector3(), _E = new THREE.Vector3(), _T = new THREE.Vector3();
const _b = new THREE.Vector3(), _f = new THREE.Vector3(), _x = new THREE.Vector3(), _y = new THREE.Vector3();
const _m = new THREE.Matrix4(), _pq = new THREE.Quaternion(), _wq1 = new THREE.Quaternion(), _wq2 = new THREE.Quaternion();
function setBone(joint, boneDir, front, parentWorldQ, outWorldQ) {
  _y.copy(boneDir).negate();
  _x.crossVectors(_y, front).normalize();
  _m.makeBasis(_x, _y, front);
  outWorldQ.setFromRotationMatrix(_m);
  joint.quaternion.copy(parentWorldQ).invert().multiply(outWorldQ);
}
function solve(j1, j2, L1, L2, target, pole, frontSign, outQ) {
  j1.parent.getWorldQuaternion(_pq);
  _S.copy(j1.position).applyMatrix4(j1.parent.matrixWorld);
  _u.subVectors(target, _S);
  let d = _u.length();
  d = clamp(d, Math.abs(L1 - L2) + 0.004, L1 + L2 - 0.004);
  if (_u.lengthSq() < 1e-8) _u.set(0, -1, 0); else _u.normalize();
  _v.copy(pole).addScaledVector(_u, -pole.dot(_u));
  if (_v.lengthSq() < 1e-6) { _v.set(0, 0, 1).addScaledVector(_u, -_u.z); if (_v.lengthSq() < 1e-6) _v.set(1, 0, 0); }
  _v.normalize();
  const A = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  _E.copy(_S).addScaledVector(_u, Math.cos(A) * L1).addScaledVector(_v, Math.sin(A) * L1);
  _T.copy(_S).addScaledVector(_u, d);
  _b.subVectors(_E, _S).normalize();
  _f.copy(_v).multiplyScalar(frontSign); _f.addScaledVector(_b, -_f.dot(_b)).normalize();
  setBone(j1, _b, _f, _pq, _wq1);
  _b.subVectors(_T, _E).normalize();
  _f.copy(_v).multiplyScalar(frontSign); _f.addScaledVector(_b, -_f.dot(_b)).normalize();
  setBone(j2, _b, _f, _wq1, _wq2);
  if (outQ) outQ.copy(_wq2);
}

function sides(v) { return Array.isArray(v) ? { L: [-v[0], v[1], v[2]], R: [v[0], v[1], v[2]] } : v; }
function toVec(ex, key) {
  const p = Object.assign({}, DEFAULT_POSE, ex.base, key);
  const out = [p.root[0], p.root[1], p.root[2]];
  for (const s of SCALARS) out.push(p[s]);
  for (const f of VEC_FIELDS) { const v = sides(p[f]); out.push(...v.L, ...v.R); }
  return out;
}
function compile(ex) {
  if (ex._keys) return;
  const keys = ex.keys.map(k => ({ t: k.t, phase: k.phase, breath: k.breath, cue: k.cue, v: toVec(ex, k) }));
  if (keys[keys.length - 1].t < 1) keys.push({ t: 1, phase: keys[keys.length - 1].phase, breath: keys[keys.length - 1].breath, cue: keys[keys.length - 1].cue, v: keys[0].v });
  ex._keys = keys;
}
const cur = new Array(3 + SCALARS.length + VEC_FIELDS.length * 6).fill(0);
function samplePose(ex, u) {
  const keys = ex._keys;
  let i = 0;
  while (i < keys.length - 2 && u >= keys[i + 1].t) i++;
  const a = keys[i], b = keys[i + 1];
  const s = smooth(clamp((u - a.t) / Math.max(1e-6, b.t - a.t), 0, 1));
  for (let k = 0; k < cur.length; k++) cur[k] = a.v[k] + (b.v[k] - a.v[k]) * s;
  return a;
}

/* ---------- 应用姿态 ---------- */
const Y_AXIS = new THREE.Vector3(0, 1, 0), X_AXIS = new THREE.Vector3(1, 0, 0);
const _tgt = new THREE.Vector3(), _pole = new THREE.Vector3(), _off = new THREE.Vector3(), _yawQ = new THREE.Quaternion(), _dq = new THREE.Quaternion(), _e = new THREE.Euler();
const _hl = new THREE.Vector3(), _hr = new THREE.Vector3(), _axis = new THREE.Vector3(), _mid = new THREE.Vector3();
function applyPose(ex) {
  const v = cur;
  root.position.set(v[0], v[1], v[2]);
  const pitch = v[3], yaw = v[4];
  root.rotation.set(pitch * D2R, yaw * D2R, 0);
  spine.rotation.x = v[5] * D2R;
  chest.rotation.x = v[6] * D2R;
  neck.rotation.x = v[7] * D2R;
  root.updateMatrixWorld(true);
  _yawQ.setFromAxisAngle(Y_AXIS, yaw * D2R);
  const footPitch = v[8], toeOut = v[9], twist = v[10];
  let o = 11;
  const hands = { L: v.slice(o, o + 3), R: v.slice(o + 3, o + 6) }; o += 6;
  const epole = { L: v.slice(o, o + 3), R: v.slice(o + 3, o + 6) }; o += 6;
  const feet = { L: v.slice(o, o + 3), R: v.slice(o + 3, o + 6) }; o += 6;
  const kpole = { L: v.slice(o, o + 3), R: v.slice(o + 3, o + 6) }; o += 6;

  for (const side of ['L', 'R']) {
    const s = side === 'L' ? -1 : 1;
    _off.fromArray(hands[side]);
    if (ex.handRel === 'world') _tgt.copy(_off);
    else if (ex.handRel === 'chest') chest.localToWorld(_tgt.copy(_off));
    else if (ex.handRel === 'root') root.localToWorld(_tgt.copy(_off));
    else rig.shoulder[side].getWorldPosition(_tgt).add(_off.applyQuaternion(_yawQ));
    _pole.fromArray(epole[side]).applyQuaternion(_yawQ);
    solve(rig.shoulder[side], rig.elbow[side], 0.30, 0.315, _tgt, _pole, -1, null);
    rig.hand[side].rotation.y = s * twist * D2R;

    _off.fromArray(feet[side]);
    if (ex.footRel === 'hip') rig.hip[side].getWorldPosition(_tgt).add(_off.applyQuaternion(_yawQ));
    else _tgt.copy(_off);
    _tgt.y += 0.068;
    _pole.fromArray(kpole[side]).applyQuaternion(_yawQ);
    solve(rig.hip[side], rig.knee[side], 0.44, 0.42, _tgt, _pole, 1, _dq);
    _e.set(footPitch * D2R, (yaw + s * toeOut) * D2R, 0, 'YXZ');
    rig.foot[side].quaternion.setFromEuler(_e).premultiply(_dq.invert());
  }
  root.updateMatrixWorld(true);

  // 杠铃跟随双手
  const bb = ex.gear.includes('barbellPad') ? gear.barbellPad : (ex.gear.includes('barbell') ? gear.barbell : null);
  if (bb) {
    rig.handAnchor.L.getWorldPosition(_hl); rig.handAnchor.R.getWorldPosition(_hr);
    _mid.addVectors(_hl, _hr).multiplyScalar(0.5);
    _axis.subVectors(_hr, _hl);
    if (_axis.lengthSq() < 0.01) _axis.copy(X_AXIS).applyQuaternion(_yawQ); else _axis.normalize();
    bb.position.copy(_mid);
    bb.quaternion.setFromUnitVectors(X_AXIS, _axis);
  }
  // 绳索跟随双手
  if (ex.gear.includes('cable')) {
    const c = ex.cable, ud = gear.cable.userData;
    gear.cable.position.set(c.x, 0, c.z);
    ud.pulley.position.set(0, c.y, -0.09);
    for (const side of ['L', 'R']) {
      rig.handAnchor[side].getWorldPosition(_hl);
      const r = ud.ropes[side];
      _mid.set(c.x, c.y, c.z - 0.12);
      _axis.subVectors(_hl, _mid);
      const len = _axis.length(); _axis.normalize();
      r.rope.position.copy(_mid); r.rope.scale.set(1, len, 1); r.rope.quaternion.setFromUnitVectors(Y_AXIS, _axis);
      r.rope.position.sub(gear.cable.position);
      r.knob.position.copy(_hl).sub(gear.cable.position);
    }
  }
}


/* ---------- 运动轨迹 ---------- */
let pathOn = true;
const pathMat = new THREE.MeshStandardMaterial({ color: col('#f2ab1c'), emissive: col('#ff9a00'), emissiveIntensity: 0.6, roughness: 0.5, metalness: 0, transparent: true, opacity: 0.85 });
let pathMesh = null;
const _pt = new THREE.Vector3();
function trackPoint(ex, out) {
  const k = ex.track || (ex.gear.includes('barbell') || ex.gear.includes('barbellPad') ? 'bar' : (ex.gear.includes('dumbbells') || ex.gear.includes('cable') ? 'handR' : 'head'));
  if (k === 'bar') { rig.handAnchor.L.getWorldPosition(out); rig.handAnchor.R.getWorldPosition(_pt); out.add(_pt).multiplyScalar(0.5); }
  else if (k === 'handR') rig.handAnchor.R.getWorldPosition(out);
  else if (k === 'root') out.copy(root.position);
  else head.getWorldPosition(out).add(_pt.set(0, 0.11, 0));
  return out;
}
function buildPath(ex) {
  if (pathMesh) { scene.remove(pathMesh); pathMesh.geometry.dispose(); pathMesh = null; }
  const N = 72, pts = [];
  const saved = u;
  for (let i = 0; i <= N; i++) { u = (i / N) % 1; samplePose(ex, u); applyPose(ex); pts.push(trackPoint(ex, new THREE.Vector3())); }
  u = saved;
  let len = 0; for (let i = 1; i < pts.length; i++) len += pts[i].distanceTo(pts[i - 1]);
  if (len < 0.08) return;
  const curve = new THREE.CatmullRomCurve3(pts, true, 'catmullrom', 0.5);
  pathMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 160, 0.0065, 8, true), pathMat);
  pathMesh.visible = pathOn;
  scene.add(pathMesh);
}

/* ---------- 肌肉高亮 ---------- */
let highlightOn = true;
function setMuscles(ex, time) {
  const pulse = reduceMotion ? 0.5 : 0.5 + 0.5 * Math.sin(time * 3.2);
  for (const id of Object.keys(muscleMats)) {
    const m = muscleMats[id];
    const isP = highlightOn && ex.primary.includes(id), isS = highlightOn && ex.secondary.includes(id);
    if (isP) { m.color.copy(MUSCLE_P); m.emissive.copy(EMIS_P); m.emissiveIntensity = 0.28 + 0.3 * pulse; }
    else if (isS) { m.color.copy(MUSCLE_S); m.emissive.copy(EMIS_S); m.emissiveIntensity = 0.1 + 0.1 * pulse; }
    else { m.color.copy(MUSCLE_BASE); m.emissiveIntensity = 0; }
  }
}

/* ---------- 相机 ---------- */
const cam = { az: -40, el: 14, dist: 3.4, tx: 0, ty: 1, tz: 0 };
const camNow = Object.assign({}, cam);
let autoSpin = false, viewMode = 'preset';
function setView(mode) {
  viewMode = mode;
  const p = current.cam;
  cam.el = p.el; cam.dist = p.dist; cam.tx = p.target[0]; cam.ty = p.target[1] + 0.55 * (root.position.y - current._keys[0].v[1]); cam.tz = p.target[2];
  cam.az = mode === 'front' ? 0 : mode === 'side' ? -90 : p.az;
  for (const b of $('#views').children) b.classList.toggle('on', b.dataset.v === mode);
}
function updateCamera(dt) {
  if (autoSpin) cam.az -= dt * 14;
  const p = current.cam;
  cam.ty = p.target[1] + 0.55 * (root.position.y - current._keys[0].v[1]);
  const k = 1 - Math.pow(0.0015, dt);
  for (const key of Object.keys(cam)) camNow[key] += (cam[key] - camNow[key]) * k;
  const az = camNow.az * D2R, el = camNow.el * D2R;
  camera.position.set(camNow.tx + camNow.dist * Math.sin(az) * Math.cos(el), camNow.ty + camNow.dist * Math.sin(el), camNow.tz + camNow.dist * Math.cos(az) * Math.cos(el));
  camera.lookAt(camNow.tx, camNow.ty, camNow.tz);
}
// 拖动旋转 / 缩放
const ptrs = new Map(); let lastPinch = 0;
stage.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId);
  if (ptrs.size === 1) {
    cam.az -= (e.clientX - p.x) * 0.45;
    cam.el = clamp(cam.el + (e.clientY - p.y) * 0.3, -4, 82);
    viewMode = 'free'; for (const b of $('#views').children) b.classList.remove('on');
  }
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastPinch) cam.dist = clamp(cam.dist * (lastPinch / d), 1.6, 7);
    lastPinch = d;
  }
});
const endPtr = e => { ptrs.delete(e.pointerId); if (ptrs.size < 2) lastPinch = 0; };
stage.addEventListener('pointerup', endPtr); stage.addEventListener('pointercancel', endPtr);
stage.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * (1 + e.deltaY * 0.0012), 1.6, 7); }, { passive: false });

/* ---------- 尺寸 ---------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

/* ---------- 界面 ---------- */
let dayIdx = 0, exId = DAYS[0].list[0], current = EX[exId];
let playing = !reduceMotion, speed = 1, u = 0, lastT = performance.now(), clock = 0, lastPhaseKey = null;

function renderDays() {
  $('#days').innerHTML = DAYS.map((d, i) => `<button class="day${i === dayIdx ? ' active' : ''}" data-i="${i}"><b>DAY ${d.n}</b><span>${d.title}，${d.focus}</span></button>`).join('');
  for (const b of $('#days').children) b.addEventListener('click', () => { dayIdx = +b.dataset.i; select(DAYS[dayIdx].list[0]); });
}
function renderChips() {
  const d = DAYS[dayIdx];
  $('#chips').innerHTML = d.list.map((id, i) => `<button class="chip${id === exId ? ' active' : ''}" data-id="${id}"><i>${i + 1}</i>${EX[id].name}</button>`).join('');
  for (const b of $('#chips').children) b.addEventListener('click', () => select(b.dataset.id));
  const act = $('#chips .active'); if (act) act.scrollIntoView({ block: 'nearest', inline: 'center', behavior: reduceMotion ? 'auto' : 'smooth' });
}
function renderInfo() {
  const ex = current;
  $('#exName').firstChild.textContent = ex.name;
  $('#exEn').textContent = ex.en;
  $('#iName').firstChild.textContent = ex.name;
  const inDays = DAYS.filter(d => d.list.includes(exId)).map(d => 'DAY ' + d.n).join(' 与 ');
  $('#iMeta').textContent = `${ex.en}，出现在 ${inDays}`;
  $('#muscles').innerHTML = ex.primary.map(m => `<span class="m p">${MUSCLE_NAMES[m]}</span>`).join('') + ex.secondary.map(m => `<span class="m">${MUSCLE_NAMES[m]}</span>`).join('');
  const linked = new Set(ex.keys.map(k => k.cue));
  $('#steps').innerHTML = ex.cues.map((c, i) => `<li class="${linked.has(i) ? '' : 'setup'}" data-i="${i}">${c}</li>`).join('');
  $('#mist').innerHTML = ex.mistakes.map(m => `<li>${m}</li>`).join('');
  $('#kv').innerHTML = `<dt>呼吸</dt><dd>${ex.breath}</dd><dt>节奏</dt><dd>${ex.tempo}</dd><dt>组次</dt><dd>${ex.plan}</dd>`;
}
function select(id) {
  exId = id; current = EX[id]; compile(current);
  dayIdx = DAYS[dayIdx].list.includes(id) ? dayIdx : DAYS.findIndex(d => d.list.includes(id));
  for (const k of Object.keys(gear)) { if (k !== 'dumbbells') gear[k].visible = current.gear.includes(k); }
  const db = current.gear.includes('dumbbells'); gear.dumbbells.L.visible = gear.dumbbells.R.visible = db;
  u = 0; lastPhaseKey = null;
  buildPath(current);
  renderDays(); renderChips(); renderInfo();
  setView(viewMode === 'free' ? 'preset' : viewMode);
  if (viewMode !== 'free') { camNow.tx = cam.tx; camNow.ty = cam.ty; camNow.tz = cam.tz; }
  step(0, true);
}
function setPlaying(p) {
  playing = p;
  $('#playIcon').innerHTML = p ? '<path d="M3 2.5h3.5v11H3zM9.5 2.5H13v11H9.5z"/>' : '<path d="M4 2.5v11l9-5.5z"/>';
}
$('#play').addEventListener('click', () => setPlaying(!playing));
for (const b of $('#speed').children) b.addEventListener('click', () => { speed = +b.dataset.v; for (const x of $('#speed').children) x.classList.toggle('on', x === b); });
for (const b of $('#views').children) b.addEventListener('click', () => setView(b.dataset.v));
$('#musclesBtn').addEventListener('click', e => { highlightOn = !highlightOn; e.currentTarget.classList.toggle('on', highlightOn); });
$('#spinBtn').addEventListener('click', e => { autoSpin = !autoSpin; e.currentTarget.classList.toggle('on', autoSpin); });
$('#pathBtn').addEventListener('click', e => { pathOn = !pathOn; e.currentTarget.classList.toggle('on', pathOn); if (pathMesh) pathMesh.visible = pathOn; });
const scrub = $('#scrub');
scrub.addEventListener('input', () => { setPlaying(false); u = scrub.value / 1000; step(0, true); });
const move = dir => { const d = DAYS[dayIdx], i = d.list.indexOf(exId); select(d.list[(i + dir + d.list.length) % d.list.length]); };
$('#prev').addEventListener('click', () => move(-1));
$('#next').addEventListener('click', () => move(1));
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
});

function step(dt, force) {
  if (playing && !force) u = (u + dt * speed / current.dur) % 1;
  const k = samplePose(current, u);
  applyPose(current);
  const pct = Math.round(u * 1000);
  if (document.activeElement !== scrub) scrub.value = pct;
  scrub.style.setProperty('--pct', (u * 100).toFixed(1) + '%');
  $('#tm').textContent = (u * current.dur).toFixed(1) + 's';
  const pk = k.phase + '|' + k.breath + '|' + k.cue;
  if (pk !== lastPhaseKey) {
    lastPhaseKey = pk;
    $('#phase').textContent = k.phase; $('#breath').textContent = k.breath;
    for (const li of $('#steps').children) li.classList.toggle('active', +li.dataset.i === k.cue);
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  const dt = clamp((now - lastT) / 1000, 0, 0.05); lastT = now; clock += dt;
  if (document.hidden) return;
  step(dt, false);
  setMuscles(current, clock);
  updateCamera(dt);
  renderer.render(scene, camera);
}
select(exId);
setPlaying(playing);
Object.assign(camNow, cam);
requestAnimationFrame(frame);
window.__app = { select, step, EX, DAYS, get u() { return u; }, set u(v) { u = v; }, setPlaying, cam, camNow, setView, renderer, scene, camera };

})();
</script>
</body>
